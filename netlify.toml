# La primera regla sirve HTML con meta Open Graph específicos de /alquiler-pro (generado en build).
# El fallback SPA debe ir después.

[[redirects]]
  from = "/alquiler-pro"
  to = "/alquiler-pro/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/alquiler-pro/"
  to = "/alquiler-pro/index.html"
  status = 200
  force = true

# Hero OG: el archivo es JPEG; antes estaba como .png (MIME incorrecto en algunos CDNs).
[[redirects]]
  from = "/alquiler-pro-hero-web.png"
  to = "/alquiler-pro-hero-web.jpg"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
